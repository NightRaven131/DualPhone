name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Repo ini sengaja tidak menyertakan gradle-wrapper.jar (binary),
      # jadi kita generate wrapper-nya di runner (runner PUNYA akses internet, beda dengan sandbox saya).
      - name: Download Gradle & generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
          export PATH="$PWD/gradle-8.7/bin:$PATH"
          gradle wrapper --gradle-version 8.7

      # WAJIB: taruh google-services.json project Firebase-mu sendiri sebagai
      # GitHub Secret bernama GOOGLE_SERVICES_JSON (isi file, base64 atau plain JSON),
      # supaya mode Remote (Firebase) bisa jalan. Kalau belum ada, langkah ini dilewati
      # dan build tetap jalan tapi mode Remote tidak akan berfungsi.
      - name: Inject google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualphone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
