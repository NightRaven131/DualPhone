name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project root
        id: project
        run: |
          DIR=$(dirname "$(find . -maxdepth 4 -name settings.gradle | head -n 1)")
          echo "Project root ditemukan di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Gradle & generate wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH="$PWD/gradle-8.7/bin:$PATH"
          gradle wrapper --gradle-version 8.7

      - name: Inject google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > "${{ steps.project.outputs.dir }}/app/google-services.json"

      - name: Build debug APKs (admin & subuser)
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleAdminDebug assembleSubuserDebug --stacktrace

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: dualphone-admin-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/admin/debug/app-admin-debug.apk

      - name: Upload SubUser APK
        uses: actions/upload-artifact@v4
        with:
          name: dualphone-subuser-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/subuser/debug/app-subuser-debug.apk

      - name: Create GitHub Release with both APKs
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/admin/debug/app-admin-debug.apk
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/subuser/debug/app-subuser-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
